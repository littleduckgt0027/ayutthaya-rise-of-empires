let S,selected='0,0',armyId=1,tab='kingdom',speed=1,mode='',cam={x:0,y:0,z:1},W,H,last=0,acc=0,audio,fxvol=.3,musicvol=.12,muted=false,toastTimer;

function rand(){S.seed=(S.seed*1664525+1013904223)>>>0;return S.seed/4294967296}function notify(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,4000)}
function log(t){S.logs.unshift({day:S.day,t});S.logs=S.logs.slice(0,100);notify(t)}function sound(type='click'){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);let f={click:420,buy:880,build:520,march:130,battle:65,victory:700,defeat:100,event:340}[type]||400;o.type=type==='battle'?'sawtooth':'sine';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.5,audio.currentTime+.15);g.gain.setValueAtTime(fxvol*.16,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.28);o.start();o.stop(audio.currentTime+.3)}catch(e){}}
function ambient(){if(!audio||muted||!musicvol)return;[146.83,220,293.66].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.setValueAtTime(0,audio.currentTime);g.gain.linearRampToValueAtTime(musicvol*.035,audio.currentTime+1);g.gain.linearRampToValueAtTime(0,audio.currentTime+5);o.start(audio.currentTime+i*.3);o.stop(audio.currentTime+5.1)})}setInterval(ambient,6000);
function newGame(){S={version:1,seed:1548,day:0,hex:[],armies:[],next:4,stocks:Array.from({length:4},(_,f)=>({gold:f===0?560:260,food:f===0?850:400,wood:350,stone:240,iron:120})),relations:[0,-35,5,-100],war:[false,true,false,true],queue:[],logs:[],objectives:OBJ.map(()=>false),happiness:78,event:null,lastEvent:-100,eventIndex:0,aiTick:0,result:null,rates:{},generals:['พระยาจักรี','ขุนพิเรนทรเทพ'],raided:false};
for(let q=-6;q<=6;q++)for(let r=-5;r<=5;r++){if(Math.abs(q+r)>7)continue;let t=rand(),terrain=t<.23?'forest':t<.37?'hill':t<.6?'farm':'plain';if(q===2)terrain=[-3,0,3].includes(r)?'bridge':'water';let f=dist({q,r},{q:0,r:0})<=1?0:q<=-4&&r<=1?1:q>=4&&r<=0?2:4;S.hex.push({id:key(q,r),q,r,terrain,f,pop:terrain==='water'?0:70+Math.floor(rand()*130),level:0,name:'',b:{},road:r===0||r===-3})}
[['0,0','กรุงศรีอยุธยา',0,3],['-1,1','บางปะอิน',0,1],['1,-1','บ้านแพรก',0,1],['-5,0','หงสาวดี',1,3],['5,-3','ละโว้',2,3],['0,-3','ค่ายป่าซาง',3,1]].forEach(([k,n,f,l])=>{let h=tile(k);Object.assign(h,{name:n,f,level:l,terrain:'plain',pop:500,b:{farm:1,...(f!==3?{barracks:1,fort:1}:{})}})});

function makeArmy(id,f,at,units,g){return{id,f,at,units,g,skill:g==='พระยาจักรี'?1.22:1.1,morale:100,path:[],progress:0,defend:false,home:at}}
function costText(c){return c.map((v,i)=>v?RN[i]+' '+v:'').filter(Boolean).join(' · ')}function afford(f,c){return R.every((r,i)=>S.stocks[f][r]>=c[i])}function pay(f,c){if(!afford(f,c))return false;R.forEach((r,i)=>S.stocks[f][r]-=c[i]);sound('buy');return true}
function objective(i){if(S.objectives[i])return;S.objectives[i]=true;S.stocks[0].gold+=60;log('ภารกิจสำเร็จ: '+OBJ[i]+' · ทอง +60');sound('victory')}
function path(from,to,f){let open=[from],prev={},score={[from]:0},closed=new Set;while(open.length){open.sort((a,b)=>score[a]+dist(tile(a),tile(to))-score[b]-dist(tile(b),tile(to)));let cur=open.shift();if(cur===to){let p=[];while(cur!==from){p.unshift(cur);cur=prev[cur]}return p}closed.add(cur);let h=tile(cur);for(let [q,r]of DIR){let n=tile(key(h.q+q,h.r+r));if(!n||n.terrain==='water'||closed.has(n.id))continue;if(n.f<3&&n.f!==f&&f===0&&!S.war[n.f])continue;let s=score[cur]+(n.terrain==='hill'?1.8:n.terrain==='forest'?1.4:1);if(score[n.id]===undefined||s<score[n.id]){score[n.id]=s;prev[n.id]=cur;if(!open.includes(n.id))open.push(n.id)}}}return null}
function order(a,target){if(!a||!tile(target)||tile(target).terrain==='water')return false;let p=path(a.at,target,a.f);if(!p||!p.length)return false;a.path=p;a.progress=0;a.defend=false;return true}
function buildMenu(){let h=tile(selected);if(h.f!==0)return notify('ก่อสร้างได้เฉพาะดินแดนของท่าน');show('การก่อสร้าง · '+(h.name||TN[h.terrain]),'<p>คลังรวมทั้งอาณาจักร: หักวัสดุทันที ไม่มีระบบขนส่งแยกเมืองในเดโมนี้ · คนงาน 25 คนต่อโครงการ · อาคารสูงสุดระดับ 3</p><div class="choices">'+Object.entries(B).map(([k,b])=>{let l=h.b[k]||0,c=b.c.map(v=>v*(l+1)),why=l>=3?'เต็มระดับ':S.queue.some(j=>j.hex===h.id)?'ช่องนี้กำลังก่อสร้าง':h.pop<25?'คนงานไม่พอ':!afford(0,c)?'ทรัพยากรไม่พอ':'';return `<button ${why?'disabled':''} title="${why}" onclick="enqueueBuild('${k}')">${b.n} → Lv.${l+1}<small>${costText(c)}<br>${b.t*(l+1)} วัน · ${b.benefit}${why?'<br>'+why:''}</small></button>`}).join('')+'</div>')}
function enqueueBuild(k){let h=tile(selected),b=B[k],l=h.b[k]||0,c=b.c.map(v=>v*(l+1));if(h.f!==0||l>=3||h.pop<25||S.queue.some(j=>j.hex===h.id)||!pay(0,c))return;S.queue.push({kind:'build',hex:h.id,b:k,remain:b.t*(l+1),total:b.t*(l+1),workers:25});closeModal();log('เริ่มสร้าง '+b.n);update()}
function upgrade(){let h=tile(selected),cap=h.id==='0,0',next=h.level+1,max=cap?10:Math.min(8,capital().level-2),c=[h.level*120+100,80,h.level*70+40,h.level*60+40,h.level*10],why=h.f!==0?'ไม่ได้เป็นเจ้าของ':!h.name?'เลือกหมู่บ้านหรือเมือง':next>max?'ต้องมีเมืองหลวงระดับ '+(next+2):S.queue.some(j=>j.hex===h.id)?'มีโครงการอยู่แล้ว':h.pop<60?'ต้องการคนงาน 60 คน':!afford(0,c)?'ทรัพยากรไม่พอ':'';show('ขยายเมือง → Lv.'+next,`<p>กฎหัวเมือง: ระดับสูงสุด = ระดับเมืองหลวง − 2 (สูงสุด 8)<br>เมืองหลวงสูงสุด 10 · ประชากร +180 · รายได้เพิ่ม<br>${costText(c)}<br>คนงาน 60 · เวลา ${20+next*8} วัน</p><p>${why}</p><button ${why?'disabled':''} onclick="confirmUpgrade()">ยืนยันการก่อสร้าง</button>`)}

function recruitMenu(){let h=tile(selected),ok=h.f===0&&h.b.barracks;show('เกณฑ์ทหาร',`<p>ต้องมีโรงทหารในช่องที่เลือก · 20 นายต่อกอง · ใช้ประชากร 20 คน<br>กองที่ฝึกเสร็จจะเข้าร่วมกองทัพมิตรที่ประจำช่องนี้ หรือจัดตั้งกองใหม่</p>`+Object.entries(U).map(([k,u])=>`<div class="card"><b>${u.n} ×20</b><p>โจมตี ${u.a} · ป้องกัน ${u.d} · ความเร็ว ${u.v}<br>เสบียง ${u.food*20}/วัน · ${costText(u.c)} · ${u.t} วัน</p><button ${!ok||h.pop<80||!afford(0,u.c)?'disabled':''} onclick="recruit('${k}')">ฝึกกำลังพล</button></div>`).join('')+(!ok?'<p>เลือกเมืองที่มีโรงทหารก่อน</p>':''))}

function power(a,def=false,h=tile(a.at)){let p=Object.entries(a.units).reduce((s,[k,n])=>s+n*(def?U[k].d:U[k].a),0)*a.skill*(.5+a.morale/200);if(def)p*=1+(h.terrain==='hill'?.25:0)+(h.b.fort||0)*.2+(a.defend?.2:0);return p}

// Procedural landscape renderer — no images, fonts or network assets.
const cv=$('map'),ctx=cv.getContext('2d'),SZ=47,sy=.77;
function xy(h){return{x:SZ*Math.sqrt(3)*(h.q+h.r/2),y:SZ*1.5*h.r*sy}}function poly(x,y,r=SZ){ctx.beginPath();for(let i=0;i<6;i++){let a=(i*60-30)*Math.PI/180,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r*sy;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}

function render(t){if(!S)return;let dpr=window.devicePixelRatio||1,nw=cv.clientWidth,nh=cv.clientHeight;if(nw!==W||nh!==H){W=nw;H=nh;cv.width=W*dpr;cv.height=H*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#263d35');bg.addColorStop(1,'#142e2a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2+cam.x,H/2+cam.y);ctx.scale(cam.z,cam.z);
let sorted=[...S.hex].sort((a,b)=>xy(a).y-xy(b).y);for(let h of sorted){let{x,y}=xy(h);poly(x,y);let g=ctx.createLinearGradient(x-30,y-30,x+30,y+30),colors={plain:['#71815a','#536d49'],farm:['#929367','#6b7e4b'],forest:['#415f47','#315340'],hill:['#7a8063','#555f48'],water:['#39696a','#244f59'],bridge:['#537c75','#38636a']};g.addColorStop(0,colors[h.terrain][0]);g.addColorStop(1,colors[h.terrain][1]);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#172f2a44';ctx.lineWidth=.8;ctx.stroke();ctx.save();ctx.clip();if(h.terrain==='water'||h.terrain==='bridge'){for(let i=0;i<8;i++){ctx.strokeStyle='#a8d7c326';ctx.beginPath();let yy=y-30+i*8;ctx.moveTo(x-45+Math.sin(t*.0005+i)*5,yy);ctx.bezierCurveTo(x-20,yy-4,x+12,yy+4,x+40,yy);ctx.stroke()}}else{for(let i=0;i<19;i++){let xx=x+(seeded(h,i)-.5)*90,yy=y+(seeded(h,i+30)-.5)*70;ctx.fillStyle=i%2?'#c1c39421':'#142e1c20';ctx.fillRect(xx,yy,2+seeded(h,i+60)*3,1)}}if(h.terrain==='farm'){for(let i=-4;i<5;i++){ctx.strokeStyle=i%2?'#c6bb6c88':'#465f37';ctx.beginPath();ctx.moveTo(x-50,y+i*8);ctx.lineTo(x+50,y+i*8-13);ctx.stroke()}}ctx.restore();if(h.road&&h.terrain!=='water'){ctx.strokeStyle='#c3ac7870';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-40,y+4);ctx.lineTo(x+40,y-4);ctx.stroke()}if(h.terrain==='bridge'){ctx.strokeStyle='#8b7857';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(x-40,y);ctx.lineTo(x+40,y);ctx.stroke();ctx.strokeStyle='#d2b888';ctx.lineWidth=2;for(let i=-36;i<40;i+=7){ctx.beginPath();ctx.moveTo(x+i,y-7);ctx.lineTo(x+i,y+7);ctx.stroke()}}if(h.terrain==='forest')for(let i=0;i<8;i++)tree(x+(seeded(h,i)-.5)*55,y+(seeded(h,i+14)-.5)*30,.65+seeded(h,i+33)*.4);if(h.terrain==='hill'){for(let i=0;i<3;i++){let xx=x+(i-1)*19;ctx.fillStyle=['#6f7858','#7b8162','#8a8d6a'][i];ctx.beginPath();ctx.moveTo(xx-23,y+15);ctx.quadraticCurveTo(xx-4,y-50+i*8,xx+23,y+15);ctx.fill();ctx.strokeStyle='#a9ad7c60';ctx.stroke()}}

for(let a of S.armies){let p=xy(tile(a.at)),x=p.x,y=p.y;if(a.path.length){ctx.setLineDash([5,5]);ctx.strokeStyle=COL[a.f];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);a.path.forEach(k=>{let p=xy(tile(k));ctx.lineTo(p.x,p.y)});ctx.stroke();ctx.setLineDash([]);let target=xy(tile(a.path[0]));x+=(target.x-x)*a.progress;y+=(target.y-y)*a.progress}y-=15;ctx.fillStyle='#091c17a0';ctx.beginPath();ctx.ellipse(x,y+8,20,8,0,0,7);ctx.fill();for(let i=0;i<3;i++){let xx=x+(i-1)*10,yy=y+Math.sin(t*.006+i)*(a.path.length?2:0);ctx.fillStyle='#b7b38a';ctx.beginPath();ctx.arc(xx,yy-9,3,0,7);ctx.fill();ctx.fillStyle=COL[a.f];ctx.fillRect(xx-3,yy-6,6,9);ctx.strokeStyle='#d8c9a0';ctx.beginPath();ctx.moveTo(xx+5,yy+2);ctx.lineTo(xx+5,yy-17);ctx.stroke()}ctx.strokeStyle='#c5b77c';ctx.beginPath();ctx.moveTo(x,y-10);ctx.lineTo(x,y-40);ctx.stroke();ctx.fillStyle=COL[a.f];ctx.beginPath();ctx.moveTo(x,y-40);ctx.lineTo(x+18,y-37+Math.sin(t*.004)*2);ctx.lineTo(x+17,y-25);ctx.lineTo(x,y-27);ctx.fill();ctx.fillStyle=a.id===armyId?'#e2c07d':'#1a2d25';ctx.fillRect(x-20,y+10,40,17);ctx.fillStyle=a.id===armyId?'#1b2922':'#eee2c0';ctx.font='bold 11px Tahoma';ctx.textAlign='center';ctx.fillText(num(a),x,y+23)}ctx.restore();let vign=ctx.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,W*.65);vign.addColorStop(0,'#07171400');vign.addColorStop(1,'#041b1766');ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);if(Math.floor(S.day/30)%12>=5&&Math.floor(S.day/30)%12<=9){ctx.strokeStyle='#b4d0c122';for(let i=0;i<55;i++){let x=(i*83+t*.08)%W,y=(i*71+t*.19)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+12);ctx.stroke()}}}

let pointer=null;cv.addEventListener('pointerdown',e=>{sound();pointer={x:e.clientX,y:e.clientY,ox:cam.x,oy:cam.y,moved:false};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!pointer)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)+Math.abs(dy)>5)pointer.moved=true;if(pointer.moved){cam.x=pointer.ox+dx;cam.y=pointer.oy+dy}});cv.addEventListener('pointerup',e=>{if(!pointer)return;if(!pointer.moved){let rect=cv.getBoundingClientRect(),x=(e.clientX-rect.left-W/2-cam.x)/cam.z,y=(e.clientY-rect.top-H/2-cam.y)/cam.z;let rr=(y/sy)*2/3/SZ,qq=(Math.sqrt(3)/3*x-y/sy/3)/SZ;let rx=Math.round(qq),rz=Math.round(rr),ry=Math.round(-qq-rr),dx=Math.abs(rx-qq),dy=Math.abs(ry+qq+rr),dz=Math.abs(rz-rr);if(dx>dy&&dx>dz)rx=-ry-rz;else if(dz>dy)rz=-rx-ry;let h=tile(key(rx,rz));if(h){if(mode==='move'){if(order(army(),h.id)){notify('ออกเดินทัพ · '+h.id);mode=''}else notify('เดินไม่ได้: ตรวจเส้นทาง ท่าข้าม และสถานะสงคราม');update()}else selectHex(h.id)}}pointer=null});cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.91)},{passive:false});document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.code==='Space'){e.preventDefault();speed=speed?0:1;update()}if(e.key==='Escape'){mode='';closeModal();update()}});document.addEventListener('click',e=>{if(e.target.closest('button'))sound()});
